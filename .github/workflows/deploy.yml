name: Deploy

# Configure before use (see README):
#   Secret   RAILWAY_TOKEN     - Railway *project* token
#   Variable RAILWAY_SERVICE   - Railway service name (or ID)
#   Variable RAILWAY_ENV       - Railway environment name, e.g. production
#   Variable APP_URL           - public URL of the deployed app, e.g. https://your-app.up.railway.app
# Set OPENROUTER_API_KEY in the Railway service's Variables tab, not in GitHub.

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}" --environment "${{ vars.RAILWAY_ENV }}"
      - name: Smoke test /health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.APP_URL }}/health"; then echo; echo "Healthy"; exit 0; fi
            echo "Waiting for the app to come up ($i/20)..."; sleep 15
          done
          echo "Health check failed" && exit 1
