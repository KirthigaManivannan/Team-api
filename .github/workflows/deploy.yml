
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  # JOB 2: Deploy to Railway
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Write commit SHA
        run: echo "${{ github.sha }}" > app/version.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      - name: Deploy
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"

  # JOB 3: Verify deployment
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      SHA: ${{ github.sha }}

    steps:
      - name: Wait for the new version, then check it
        run: |
          for i in $(seq 1 20); do
            v=$(curl -fs --max-time 10 "$APP_URL/health" | jq -r .version || true)

            if [ "$v" = "$SHA" ]; then
              echo "Live: $v"
              exit 0
            fi

            echo "Attempt $i: live version is '$v', waiting..."
            sleep 15
          done

          echo "New version never went live"
          exit 1
